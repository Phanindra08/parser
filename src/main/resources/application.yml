spring:
  application:
    name: parser

  datasource:
    url: jdbc:h2:mem:parserdb
    username: parser
    password: parser
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

logging:
  level:
    root: INFO

dl-output: D:\\RA\\Combining\\Outputs\\
chunk-size: 5

d-real:
  docker:
    image: dreal/dreal3
  mounted-file-path: /data/

keymaerax:
  jar:
    path: libs/keymaerax.jar